name: CI Pipeline

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

env:
  AWS_REGION: us-east-1

jobs:
  lint-and-test:
    name: Lint & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - product-service
          - cart-service
          - inventory-service
          - order-service
          - notification-service
          - admin-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install Dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black isort pytest pytest-cov

      - name: Lint (Flake8 / Black / isort)
        working-directory: services/${{ matrix.service }}
        run: |
          flake8 . --max-line-length=88 --extend-ignore=E203,W503 || true
          black --check . || true
          isort --check-only . || true

      - name: Unit & Integration Tests
        working-directory: services/${{ matrix.service }}
        env:
          DATABASE_URL: sqlite:///test.db
          FLASK_ENV: testing
        run: |
          pytest --cov=app --cov-report=term-missing || true

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  secret-scan:
    name: GitLeaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: GitLeaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "ecommerce-platform"
          path: "."
          format: "HTML"
          out: "reports"
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports

  license-compliance:
    name: License Compliance (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        service:
          - product-service
          - cart-service
          - inventory-service
          - order-service
          - notification-service
          - admin-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install service dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-licenses
      - name: Fail on copyleft licenses (GPL/AGPL/LGPL)
        working-directory: services/${{ matrix.service }}
        run: |
          pip-licenses --format=markdown --output-file=licenses.md
          if pip-licenses --format=json | grep -Ei '"License": ".*(GPL|AGPL)' ; then
            echo "::error::Copyleft-licensed dependency detected — review before merging."
            exit 1
          fi
      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: licenses-${{ matrix.service }}
          path: services/${{ matrix.service }}/licenses.md

  iac-scan:
    name: IaC Security Scan (tfsec + checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infrastructure/terraform
          soft_fail: false
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/terraform
          framework: terraform
          soft_fail: false
          output_format: cli

  build-scan-push:
    name: Build, Trivy Scan & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [sonarqube, secret-scan, dependency-check, license-compliance, iac-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    strategy:
      fail-fast: false
      matrix:
        service:
          - product-service
          - cart-service
          - inventory-service
          - order-service
          - notification-service
          - admin-service
          - api-gateway
          - frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GHA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine build context
        id: ctx
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            echo "path=frontend" >> "$GITHUB_OUTPUT"
          else
            echo "path=services/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker Image
        working-directory: ${{ steps.ctx.outputs.path }}
        run: docker build -t ${{ matrix.service }}:${{ github.sha }} .

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Tag & Push to ECR
        run: |
          REGISTRY=${{ steps.ecr-login.outputs.registry }}
          docker tag ${{ matrix.service }}:${{ github.sha }} $REGISTRY/${{ matrix.service }}:${{ github.sha }}
          docker push $REGISTRY/${{ matrix.service }}:${{ github.sha }}
          # NOTE: no floating "latest-<branch>" tag — the ECR repos are
          # image_tag_mutability = IMMUTABLE (see modules/ecr), so re-pushing
          # the same tag on the next commit would fail with
          # ImageTagAlreadyExistsException. cd-deploy.yml always deploys by
          # commit SHA, so a floating tag isn't needed anyway.
