apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ecom-prod
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: <account_id>.dkr.ecr.us-east-1.amazonaws.com/frontend:GIT_SHA
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "128Mi" }
