# DEV placeholder. This project's dev Terraform environment does not deploy
# RDS (see infrastructure/terraform/environments/dev/main.tf) to stay in
# Free Tier, so DATABASE_URL is a non-functional placeholder — services boot
# fine, but any code path that actually queries the database will fail until
# this is pointed at a real instance. In a real deployment this Secret would
# instead be synced from AWS Secrets Manager via the External Secrets
# Operator (see docs/Engineering-Handbook.md, Section 8.2).
# Do NOT commit real credentials here.
apiVersion: v1
kind: Secret
metadata:
  name: order-service-secrets
  namespace: ecom-dev
type: Opaque
stringData:
  DATABASE_URL: "postgresql://REPLACE_ME@rds-endpoint:5432/ecom_order"
