apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      # Every core Flask service already exposes /metrics via
      # prometheus-flask-exporter (per the Engineering Handbook, Section 9).
      # Kubernetes service discovery finds them automatically by label,
      # rather than hardcoding a static target list per environment.
      - job_name: "flask-services"
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: (product-service|cart-service|inventory-service|order-service|notification-service|admin-service|api-gateway)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: service
