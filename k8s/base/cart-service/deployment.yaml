apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: ecom-prod
  labels:
    app: cart-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
    spec:
      containers:
        - name: cart-service
          image: 291761344539.dkr.ecr.us-east-1.amazonaws.com/cart-service:latest
          ports:
            - containerPort: 5002
          envFrom:
            - configMapRef:
                name: cart-service-config
            - secretRef:
                name: cart-service-secrets
          readinessProbe:
            httpGet: { path: /health, port: 5002 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 5002 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
