apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecom-prod
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: <account_id>.dkr.ecr.us-east-1.amazonaws.com/api-gateway:GIT_SHA
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: api-gateway-config }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
