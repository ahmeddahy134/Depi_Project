apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: ecom-prod
  labels:
    app: inventory-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: <account_id>.dkr.ecr.us-east-1.amazonaws.com/inventory-service:GIT_SHA
          ports:
            - containerPort: 5003
          envFrom:
            - configMapRef:
                name: inventory-service-config
            - secretRef:
                name: inventory-service-secrets
          readinessProbe:
            httpGet: { path: /health, port: 5003 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 5003 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
