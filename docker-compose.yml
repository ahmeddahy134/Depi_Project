version: "3.9"

# Enterprise DevSecOps E-Commerce Platform
# Local development stack — mirrors the AWS/EKS topology described in docs/Engineering-Handbook.md

services:

  # ---------------------------------------------------------------------
  # Data layer
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ecom-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: "ecom_product,ecom_cart,ecom_inventory,ecom_order,ecom_notification,ecom_admin"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecom-net

  redis:
    image: redis:7-alpine
    container_name: ecom-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ecom-net

  # ---------------------------------------------------------------------
  # Microservices (Section 3 of the handbook)
  # ---------------------------------------------------------------------
  product-service:
    build: ./services/product-service
    container_name: ecom-product-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecom_product
      REDIS_URL: redis://redis:6379/0
      FLASK_APP: run.py
      FLASK_ENV: development
      FLASK_RUN_PORT: "5001"
    ports:
      - "5001:5001"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [ecom-net]

  cart-service:
    build: ./services/cart-service
    container_name: ecom-cart-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecom_cart
      PRODUCT_SERVICE_URL: http://product-service:5001
      FLASK_APP: run.py
      FLASK_ENV: development
      FLASK_RUN_PORT: "5002"
    ports:
      - "5002:5002"
    depends_on:
      postgres: { condition: service_healthy }
      product-service:
        condition: service_started
    networks: [ecom-net]

  inventory-service:
    build: ./services/inventory-service
    container_name: ecom-inventory-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecom_inventory
      FLASK_APP: run.py
      FLASK_ENV: development
      FLASK_RUN_PORT: "5003"
    ports:
      - "5003:5003"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [ecom-net]

  order-service:
    build: ./services/order-service
    container_name: ecom-order-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecom_order
      PRODUCT_SERVICE_URL: http://product-service:5001
      INVENTORY_SERVICE_URL: http://inventory-service:5003
      NOTIFICATION_SERVICE_URL: http://notification-service:5005
      FLASK_APP: run.py
      FLASK_ENV: development
      FLASK_RUN_PORT: "5004"
    ports:
      - "5004:5004"
    depends_on:
      postgres: { condition: service_healthy }
      inventory-service:
        condition: service_started
      product-service:
        condition: service_started
    networks: [ecom-net]

  notification-service:
    build: ./services/notification-service
    container_name: ecom-notification-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecom_notification
      FLASK_APP: run.py
      FLASK_ENV: development
      FLASK_RUN_PORT: "5005"
    ports:
      - "5005:5005"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [ecom-net]

  admin-service:
    build: ./services/admin-service
    container_name: ecom-admin-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecom_admin
      PRODUCT_SERVICE_URL: http://product-service:5001
      ORDER_SERVICE_URL: http://order-service:5004
      FLASK_APP: app.py
      FLASK_ENV: development
      FLASK_RUN_PORT: "5010"
    ports:
      - "5010:5010"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [ecom-net]

  # ---------------------------------------------------------------------
  # Edge / API Gateway
  # ---------------------------------------------------------------------
  api-gateway:
    build: ./services/api-gateway
    container_name: ecom-api-gateway
    environment:
      PORT: "8080"
      PRODUCT_SERVICE_URL: http://product-service:5001
      CART_SERVICE_URL: http://cart-service:5002
      INVENTORY_SERVICE_URL: http://inventory-service:5003
      ORDER_SERVICE_URL: http://order-service:5004
      NOTIFICATION_SERVICE_URL: http://notification-service:5005
    ports:
      - "8080:8080"
    depends_on:
      - product-service
      - cart-service
      - inventory-service
      - order-service
      - notification-service
    networks: [ecom-net]

  # ---------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: ecom-frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks: [ecom-net]

  # ---------------------------------------------------------------------
  # Monitoring (Section 9 of the handbook)
  # ---------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: ecom-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: [ecom-net]

  grafana:
    image: grafana/grafana:latest
    container_name: ecom-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks: [ecom-net]

volumes:
  pgdata:
  grafana-data:

networks:
  ecom-net:
    driver: bridge
